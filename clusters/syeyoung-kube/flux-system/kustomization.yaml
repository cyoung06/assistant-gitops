apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
  # The node has 2 CPUs and other apps already reserve almost all of it. Flux's controllers
  # idle far below their default 100m request, so reserve less.
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 20m
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=flux
