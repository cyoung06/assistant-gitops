# act_runner settings. Jobs run in containers on the runner's own Docker daemon.
log:
  level: info
runner:
  file: /data/.runner
  capacity: 2
  timeout: 1h
  labels:
    - "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest"
cache:
  enabled: true
  dir: /data/cache
container:
  # Mount the runner's Docker socket into job containers so jobs can build images.
  docker_host: ""
  # A named volume for actions' tool downloads (setup-java's JDK, setup-node's Node), so each
  # version is downloaded once instead of on every run.
  options: "-v hostedtoolcache:/opt/hostedtoolcache"
  valid_volumes:
    - hostedtoolcache
