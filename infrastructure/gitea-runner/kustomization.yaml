apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitea-runner
resources:
  - namespace.yaml
  - runner-token.sops.yaml
  - runner.yaml
configMapGenerator:
  - name: runner-config
    files:
      - config.yaml
      # Inner Docker's MTU must match the pod network (flannel VXLAN: 1450). With the default 1500,
      # large packets are dropped: TLS handshakes stall and downloads crawl.
      - daemon.json
