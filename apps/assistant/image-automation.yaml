# Commits new image tags (chosen by the ImagePolicies in this namespace) back to this repo.
# It must live in the same namespace as the ImagePolicies it applies.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: assistant
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux
        email: flux@noreply.localhost
      messageTemplate: |
        Deploy {{ range .Changed.Changes }}{{ .NewValue }} {{ end }}
    push:
      branch: main
  update:
    path: ./apps/assistant
    strategy: Setters
