# Private: https://assistant.lonk-kelvin.ts.net, reachable only from the tailnet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assistant
  annotations:
    # Served by the ProxyGroup with static endpoints (tailscale.yaml): direct, not relayed.
    tailscale.com/proxy-group: assistant
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: assistant-web
      port:
        name: http
  tls:
    - hosts:
        - assistant
