apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-web
  labels:
    app: assistant-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-web
  template:
    metadata:
      labels:
        app: assistant-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/cyoung06/assistant-web:40-39404b1@sha256:6c61e200580534b53e2c17bfde5a8761fe6d84048c835d937475da925e67f6df # set by deploy.sh
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: assistant-web
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-web
spec:
  selector:
    app: assistant-web
  ports:
    - name: http
      port: 80
      targetPort: http
