apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-web
  labels:
    app: assistant-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-web
  template:
    metadata:
      labels:
        app: assistant-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/cyoung06/assistant-web:36-91f6586@sha256:585336b8e6ed18b1c8c265db62c03f2a5100efe8e81a7f07561a1f19e028daeb # set by deploy.sh
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: assistant-web
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-web
spec:
  selector:
    app: assistant-web
  ports:
    - name: http
      port: 80
      targetPort: http
