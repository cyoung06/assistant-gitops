apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-web
  labels:
    app: assistant-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-web
  template:
    metadata:
      labels:
        app: assistant-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/cyoung06/assistant-web:51-9916af6@sha256:8a7f1fe2abb4452969ee1db2dc448adb47686545a9b3277df0cf934e2a5742d6 # set by deploy.sh
          ports:
            - name: http
              containerPort: 8080
            # Only the Outlook add-in and its API, for the public ingress.
            - name: public
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: assistant-web
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-web
spec:
  selector:
    app: assistant-web
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: public
      port: 8081
      targetPort: public
