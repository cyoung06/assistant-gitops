apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-web
  labels:
    app: assistant-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-web
  template:
    metadata:
      labels:
        app: assistant-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/cyoung06/assistant-web:45-cc29532@sha256:47fb68964be05b01b59ea976cc173e30bc3fc5f68f5be2a339d47a4f0fe97d9c # set by deploy.sh
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: assistant-web
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-web
spec:
  selector:
    app: assistant-web
  ports:
    - name: http
      port: 80
      targetPort: http
