apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-api
  labels:
    app: assistant-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-api
  template:
    metadata:
      labels:
        app: assistant-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/cyoung06/assistant-api:66-df64744@sha256:76a8194980c130f564e568f5c88d6e17912f0843d098a0fd0230efb909ff6cb5 # set by deploy.sh
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: assistant-api
            - secretRef:
                name: assistant-api
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          resources:
            requests:
              cpu: 20m
              memory: 512Mi
            limits:
              # The JVM's heap is 60% of this; the rest is off-heap (Netty, the core's live documents, PDFBox).
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-api
spec:
  selector:
    app: assistant-api
  ports:
    - name: http
      port: 8080
      targetPort: http
