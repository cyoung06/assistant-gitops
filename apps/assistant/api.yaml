apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-api
  labels:
    app: assistant-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant-api
  template:
    metadata:
      labels:
        app: assistant-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/cyoung06/assistant-api:48-db7f21f@sha256:01e2f41e0a411b5958430ee96f01d570c4142f2f2fca1ec42a2046b00baad72f # set by deploy.sh
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: assistant-api
            - secretRef:
                name: assistant-api
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          resources:
            requests:
              cpu: 20m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-api
spec:
  selector:
    app: assistant-api
  ports:
    - name: http
      port: 8080
      targetPort: http
