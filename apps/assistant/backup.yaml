# Backups against our own code going wrong (a bug wrecking notes or notebooks): a snapshot every hour,
# kept for 2 days, and the 4 o'clock one of each day kept for 30, so there's a point just before any
# damage to go back to. All on the HDD, in /mnt/hdd/backups/assistant (named YYYY-MM-DD-HH, Seoul time):
#   db/assistant-<when>.dump   the database (pg_dump; pg_restore --clean -d assistant <dump>)
#   drive/<when>/              the drive's files
#   radicale/<when>/           the calendar's data
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "0 * * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
              command: [sh, -euc]
              args:
                - |
                  when=$(date +%F-%H)
                  mkdir -p /backups/db /backups/drive /backups/radicale

                  # The database, as one restorable file; written aside, then put in place.
                  PGPASSWORD="$DB_PASSWORD" pg_dump -h postgres -U assistant -d assistant -Fc -f "/backups/db/assistant-$when.dump.part"
                  mv "/backups/db/assistant-$when.dump.part" "/backups/db/assistant-$when.dump"

                  # The drive and the calendar as they are now. A copy keeps its source's times, so
                  # each is stamped with now (its age is what's let go by).
                  for what in drive radicale; do
                    rm -rf "/backups/$what/$when.part"
                    cp -a "/$what" "/backups/$what/$when.part"
                    rm -rf "/backups/$what/$when"
                    mv "/backups/$what/$when.part" "/backups/$what/$when"
                    touch "/backups/$what/$when"
                  done

                  # Hourly ones older than 2 days let go, except each day's 04; those after 30 days.
                  find /backups/db -maxdepth 1 -name 'assistant-20*.dump' ! -name '*-04.dump' -mmin +2880 -delete
                  find /backups/db -maxdepth 1 -name 'assistant-20*.dump' -mtime +30 -delete
                  find /backups/drive /backups/radicale -mindepth 1 -maxdepth 1 -type d -name '20??-??-??-??' ! -name '*-04' -mmin +2880 -exec rm -rf {} +
                  find /backups/drive /backups/radicale -mindepth 1 -maxdepth 1 -type d -name '20??-??-??-??' -mtime +30 -exec rm -rf {} +
                  echo "backed up $when: $(du -sh "/backups/db/assistant-$when.dump" | cut -f1) database, $(du -sh "/backups/drive/$when" | cut -f1) drive, $(du -sh "/backups/radicale/$when" | cut -f1) calendar"
              env:
                # Folders and dumps named by the day here, not UTC's.
                - name: TZ
                  value: Asia/Seoul
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: assistant-api
                      key: DB_PASSWORD
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: drive
                  mountPath: /drive
                  readOnly: true
                - name: radicale
                  mountPath: /radicale
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: drive
              persistentVolumeClaim:
                claimName: drive-data
                readOnly: true
            - name: radicale
              persistentVolumeClaim:
                claimName: radicale-data
                readOnly: true
            - name: backups
              hostPath:
                path: /mnt/hdd/backups/assistant
                type: DirectoryOrCreate
