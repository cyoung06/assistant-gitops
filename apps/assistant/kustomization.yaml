apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: assistant
resources:
  - namespace.yaml
  - api-secrets.sops.yaml
  - radicale-users.sops.yaml
  - radicale.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
  - images.yaml
  - image-automation.yaml
configMapGenerator:
  - name: assistant-api
    literals:
      - DB_R2DBC_URL=r2dbc:postgresql://postgres:5432/assistant
      - DB_JDBC_URL=jdbc:postgresql://postgres:5432/assistant
      - DB_USERNAME=assistant
      - PLMS_ENABLED=true
      - DAV_URL=http://radicale:5232
      - DAV_USERNAME=syeyoung
      - PUBLIC_URL=https://assistant.lonk-kelvin.ts.net
      # Through this host only /api/v1/public is answered (see apps/assistant-public).
      - PUBLIC_HOST=assistant.syeyoung.dev
      # Microsoft Entra app registration (public client) for Outlook mail; empty = mail source off.
      - MAIL_CLIENT_ID=ad15ba37-2ae3-4e75-8137-17070a00646d
      - MAIL_TENANT=postech.ac.kr
  - name: assistant-web
    literals:
      - API_UPSTREAM=http://assistant-api:8080
