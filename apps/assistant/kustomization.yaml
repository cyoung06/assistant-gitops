apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: assistant
resources:
  - namespace.yaml
  - api-secrets.sops.yaml
  - radicale-users.sops.yaml
  - radicale.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
  - images.yaml
  - image-automation.yaml
configMapGenerator:
  - name: assistant-api
    literals:
      - DB_R2DBC_URL=r2dbc:postgresql://postgres:5432/assistant
      - DB_JDBC_URL=jdbc:postgresql://postgres:5432/assistant
      - DB_USERNAME=assistant
      - LLM_MODEL=gpt-6-luna
      - PLMS_ENABLED=true
      - DAV_URL=http://radicale:5232
      - DAV_USERNAME=syeyoung
      # Paused while moving to CalDAV; re-enabled after the migration.
      - SOURCES_SCHEDULER_ENABLED=false
  - name: assistant-web
    literals:
      - API_UPSTREAM=http://assistant-api:8080
