apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: assistant
resources:
  - namespace.yaml
  - api-secrets.sops.yaml
  - tunnel-secrets.sops.yaml
  - radicale-users.sops.yaml
  - radicale.yaml
  - drive-users.sops.yaml
  - drive.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - tunnel.yaml
  - tailscale.yaml
  - ingress.yaml
configMapGenerator:
  - name: assistant-api
    literals:
      - DB_R2DBC_URL=r2dbc:postgresql://postgres:5432/assistant
      - DB_JDBC_URL=jdbc:postgresql://postgres:5432/assistant
      - DB_USERNAME=assistant
      - PLMS_ENABLED=true
      - DAV_URL=http://radicale:5232
      - DAV_USERNAME=syeyoung
      - PUBLIC_URL=https://assistant.lonk-kelvin.ts.net
      # Outlook mail over IMAP signs in as Thunderbird (Mozilla's public client ID): POSTECH doesn't let users
      # consent to their own app registrations. Empty = mail source off.
      - MAIL_CLIENT_ID=9e5f94bc-e8a4-4e73-b8be-63364c29d753
      - MAIL_TENANT=postech.ac.kr
      # GitHub App for references to repos, issues and PRs (its private key is in api-secrets).
      - GITHUB_APP_ID=5378549
      # The drive (WebDAV, apps/assistant/drive.yaml): in the cluster, and as devices reach it.
      - DRIVE_URL=http://drive:8080
      - DRIVE_USERNAME=syeyoung
      - DRIVE_PUBLIC_URL=https://files.lonk-kelvin.ts.net
  - name: assistant-web
    literals:
      - API_UPSTREAM=http://assistant-api:8080
