# Flux watches the registry and moves the Deployments to the newest CI build (<run>-<sha>, highest run wins).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: assistant-api
spec:
  image: registry.syeyoung.dev/assistant/assistant-api
  interval: 2m
  secretRef:
    name: regcred
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: assistant-api
spec:
  imageRepositoryRef:
    name: assistant-api
  filterTags:
    pattern: '^(?P<run>[0-9]+)-[0-9a-f]{7}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: assistant-web
spec:
  image: registry.syeyoung.dev/assistant/assistant-web
  interval: 2m
  secretRef:
    name: regcred
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: assistant-web
spec:
  imageRepositoryRef:
    name: assistant-web
  filterTags:
    pattern: '^(?P<run>[0-9]+)-[0-9a-f]{7}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
