# Istio's gateway reads TLS secrets from istio-system.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: assistant-syeyoung-dev-cert
  namespace: istio-system
spec:
  secretName: assistant-syeyoung-dev-cert
  dnsNames:
    - assistant.syeyoung.dev
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
